{% extends 'base.html' %}
{% load static %}
{% block title %}登录 - EDMground{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>登录 EDMground</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="auth-btn">登录</button>
        </form>

        <div class="auth-footer">
            还没有账号？
            <a href="{% url 'users:register' %}">立即注册</a>
        </div>
    </div>
</div>
{% endblock %}
