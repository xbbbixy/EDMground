<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<h2>🔔 通知中心</h2>
{% for n in notifications %}
  <div class="{% if not n.is_read %}unread{% endif %}">
    <a href="{{ n.link_url }}">{{ n.message }}</a>
  </div>
{% empty %}
  <p>暂无通知</p>
{% endfor %}
</body>
</html>
