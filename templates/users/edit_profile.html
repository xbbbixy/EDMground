{% load static %}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>编辑个人资料</title>
    <link rel="stylesheet" href="{% static 'css/profile.css' %}">
</head>
<body>

<form class="profile-edit-card" method="post" enctype="multipart/form-data">
    {% csrf_token %}

    <h2 class="card-title">🛠 编辑个人资料</h2>

    <!-- 头像 -->
    <div class="form-group">
        <label>头像</label>
        {% if profile.avatar %}
            <img src="{{ profile.avatar.url }}" class="avatar-preview">
        {% endif %}
        <input type="file" name="avatar">
    </div>

    <!-- 昵称 -->
    <div class="form-group">
        <label>昵称</label>
        <input type="text" name="nickname" value="{{ profile.nickname }}" placeholder="你的艺名 / 昵称">
    </div>

    <!-- 简介 -->
    <div class="form-group">
        <label>个人简介</label>
        <textarea name="bio" rows="4" placeholder="介绍一下你的音乐偏好或经历">{{ profile.bio }}</textarea>
    </div>

    <!-- 社交链接 -->
    <div class="form-group">
        <label>Instagram</label>
        <input type="url" name="instagram" value="{{ profile.instagram }}">
    </div>

    <div class="form-group">
        <label>Twitter</label>
        <input type="url" name="twitter" value="{{ profile.twitter }}">
    </div>

    <div class="form-group">
        <label>SoundCloud</label>
        <input type="url" name="soundcloud" value="{{ profile.soundcloud }}">
    </div>

    <!-- 音乐基因 -->
    <div class="form-group">
        <label>音乐基因（可多选）</label>
        <div class="genre-select">
            {% for g in genres %}
                <label class="genre-checkbox">
                    <input type="checkbox"
                           name="music_genres"
                           value="{{ g.id }}"
                           {% if g in profile.music_genres.all %}checked{% endif %}>
                    <span>{{ g.name }}</span>
                </label>
            {% endfor %}
        </div>
    </div>

    <div class="form-actions">
        <button type="submit" class="btn-primary">保存修改</button>
        <a href="{% url 'users:profile' user.id %}" class="btn-secondary">取消</a>
    </div>
</form>

</body>
</html>
